[package]
publish = false
name = "airlock-dom0-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Airlock system services for dom0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "airlock-dom0-service"
path = "src/main.rs"

[[bin]]
name = "airlock-boot-journal"
path = "src/bin/airlock-boot-journal.rs"

[features]
default = ["qubes"]
qubes = ["dep:airlock-qubes"]

[dependencies]
airlock-deployment-core = { path = "../../airlock-common/deployment" }
airlock-machine-planning = { path = "../../airlock-common/machine-planning", features = ["wire"] }
airlock-qubes = { path = "../../airlock-common/qubes", optional = true }
airlock-machine-core = { path = "../../airlock-common/machine" }
airlock-nix-core = { path = "../../airlock-common/nix", features = ["artifacts"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
quick-xml = "0.41"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rustix = { version = "1.1", features = ["event", "fs", "mount", "process", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false }
udev = "0.9"
tar = "0.4"
tempfile = "3.0"
time = { version = "0.3", default-features = false, features = ["formatting"] }
