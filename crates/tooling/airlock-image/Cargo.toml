[package]
name = "airlock-image"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Airlock installation media preparation and provisioning"

[lib]
path = "src/lib.rs"

[[bin]]
name = "airlock-usb"
path = "src/bin/airlock-usb.rs"

[[bin]]
name = "airlock-image-check"
path = "src/bin/airlock-image-check.rs"

[[bin]]
name = "airlock-prepare-runtime"
path = "src/bin/airlock-prepare-runtime.rs"
required-features = ["qubes"]

[features]
default = ["qubes"]
qubes = ["dep:pyo3", "dep:airlock-qubes"]

[dependencies]
airlock-provisioning-core = { path = "../../airlock-common/provisioning" }
airlock-machine-core = { path = "../../airlock-common/machine" }
airlock-qubes = { path = "../../airlock-common/qubes", optional = true }
airlock-nix-core = { path = "../../airlock-common/nix", features = ["runtime"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.41"
pyo3 = { version = "0.29.0", default-features = false, features = ["auto-initialize"], optional = true }
rusix = { path = "../../vendor/rusix/crates/rusix", default-features = false }
rustix = { version = "1.1", features = ["fs", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1.3"
tar = "0.4"
tempfile = "3.0"

[dev-dependencies]
airlock-tests = { path = "../../airlock-tests" }
