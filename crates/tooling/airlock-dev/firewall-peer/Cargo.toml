[package]
name = "airlock-firewall-lab-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

# Static Linux lab executables deliberately exclude workstation/deployment dependencies.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
