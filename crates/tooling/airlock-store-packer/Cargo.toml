[package]
name = "airlock-store-packer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Canonical immutable package fragments with independently locked build inputs"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "airlock-store-packer"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.0"
