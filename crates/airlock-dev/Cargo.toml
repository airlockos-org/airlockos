[package]
name = "airlock-dev"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Airlock development workstation operations"

[[bin]]
name = "airlock-dev"
path = "src/main.rs"

[[bin]]
name = "clipboard-lab"
path = "src/bin/clipboard-lab.rs"

[dependencies]
airlock-config = { path = "../airlock-config" }
airlock-image = { path = "../airlock-image", default-features = false }
airlock-nix-core = { path = "../airlock-common/nix", features = ["runtime", "artifacts"] }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
rustix = { version = "1.1", features = ["fs", "event", "process", "thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
tar = "0.4"
tempfile = "3.0"
toml = "1"

[dev-dependencies]
airlock-tests = { path = "../airlock-tests" }
