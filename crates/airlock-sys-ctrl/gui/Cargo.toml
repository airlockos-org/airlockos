[package]
publish = false
name = "airlock-sys-ctrl-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Airlock graphical interface for sys-ctrl"

[[bin]]
name = "airlock-sys-ctrl-gui"
path = "src/main.rs"

[dependencies]
airlock-desktop = { path = "../../airlock-common/desktop" }
airlock-nix-core = { path = "../../airlock-common/nix" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = { version = "2.7", features = ["inline"] }
tempfile = "3.0"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Enable the standard GNOME decorations when Wayland requires a client title bar.
# This unifies with eframe's winit; desktop-provided decorations remain preferred.
winit = { version = "=0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
