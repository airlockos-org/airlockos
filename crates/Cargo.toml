[workspace]
exclude = ["vendor/rusix", "tooling/airlock-store-packer"]
members = [
    "airlock-common/clipboard",
    "runtime/airlock-sys-clipboard",
    "airlock-config",
    "airlock-tests",
    "airlock-common/nix",
    "airlock-common/machine",
    "airlock-common/deployment",
    "airlock-common/diagnostics",
    "airlock-common/provisioning",
    "airlock-common/machine-planning",
    "airlock-common/build",
    "airlock-common/build-plan",
    "airlock-common/desktop",
    "airlock-common/qubes",
    "runtime/airlock-qubes-python",
    "runtime/airlock-cli",
    "tooling/airlock-image",
    "tooling/airlock-dev",
    "runtime/airlock-dom0/service",
    "runtime/airlock-sys-ctrl/gui",
    "runtime/airlock-sys-ctrl/service",
    "runtime/airlock-sys-gui/service",
    "runtime/airlock-sys-gui/setup",
    "runtime/airlock-vm/service",
    "runtime/airlock-vm/init",
]
resolver = "3"

[profile.release]
strip = true
