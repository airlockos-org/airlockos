[package]
publish = false
name = "airlock-sys-gui-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Airlock desktop integration in sys-gui"

[[bin]]
name = "airlock-sys-gui-service"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
# Runtime I/O and X11 dependencies stay out of configuration compilation.
runtime = [
    "airlock-nix-core/runtime",
    "dep:anyhow", "dep:rustix", "dep:sha2", "dep:tempfile",
    "dep:airlock-vm-service", "dep:uuid", "dep:x11rb", "dep:png",
]
authoring = ["dep:rusix", "dep:airlock-build"]

[lib]
path = "src/lib.rs"

[dependencies]
airlock-desktop = { path = "../../../airlock-common/desktop" }
airlock-build = { path = "../../../airlock-common/build", optional = true }
airlock-machine-core = { path = "../../../airlock-common/machine" }
airlock-nix-core = { path = "../../../airlock-common/nix" }
anyhow = { version = "1.0", optional = true }
clap = { version = "4.5", features = ["derive"] }
png = { version = "0.18", optional = true }
rustix = { version = "1.1", features = ["fs", "event", "process"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3.0", optional = true }
airlock-vm-service = { path = "../../airlock-vm/service", optional = true }
uuid = { version = "1", features = ["serde"], optional = true }
x11rb = { version = "0.13", features = ["res"], optional = true }
rusix = { workspace = true, optional = true }
