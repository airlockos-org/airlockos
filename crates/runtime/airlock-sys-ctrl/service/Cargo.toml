[package]
publish = false
name = "airlock-sys-ctrl-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Airlock system services for sys-ctrl"

[[bin]]
name = "airlock-sys-ctrl-service"
path = "src/main.rs"

[dependencies]
airlock-nix-core = { path = "../../../airlock-common/nix", features = ["runtime", "job-writer"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
rustix = { version = "1.1", features = ["fs", "event", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.0"
