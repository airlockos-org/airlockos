[package]
publish = false
name = "airlock-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Airlock command line interface"

[dependencies]
airlock-diagnostics = { path = "../../airlock-common/diagnostics", features = ["runtime"] }
airlock-nix-core = { path = "../../airlock-common/nix", features = ["runtime", "artifacts"] }
anyhow = "1.0"
rustix = { version = "1.1", features = ["fs", "process"] }
sha2 = "0.10"

clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"

[[bin]]
name = "airlock"
path = "src/main.rs"
