[package]
publish = false
name = "airlock-vm-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Airlock integration services inside individual VMs"

[[bin]]
name = "airlock-vm-service"
path = "src/main.rs"

[dependencies]
airlock-machine-core = { path = "../../../airlock-common/machine" }
airlock-machine-planning = { path = "../../../airlock-common/machine-planning" }
airlock-nix-core = { path = "../../../airlock-common/nix", features = ["runtime"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1.1", features = ["fs", "event", "process", "termios", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.0"
tar = "0.4"
flate2 = "1"
shlex = "1.3"
signal-hook = { version = "0.3", default-features = false }
ini_core = "0.2"
freedesktop-icons = "0.4"
airlock-clipboard-core = { path = "../../../airlock-common/clipboard" }
airlock-sys-clipboard = { path = "../../airlock-sys-clipboard" }
xen-transport = { git = "https://github.com/airlockos-org/hermit-xen", rev = "909d25eff50a13dfc64e0a5d56a1c9dac16795e4", features = ["linux"] }
x11rb = { version = "0.13", features = ["xfixes"] }

[lib]
path = "src/lib.rs"
