[package]
name = "airlock-qubes-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Native Airlock storage and GPU plugins loaded by Qubes"

[lib]
name = "airlock_qubes_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
airlock-nix-core = { path = "../../airlock-common/nix" }
airlock-dom0-service = { path = "../airlock-dom0/service", default-features = false }
airlock-qubes = { path = "../../airlock-common/qubes" }
anyhow = "1.0"
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"
