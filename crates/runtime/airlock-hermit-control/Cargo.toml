[package]
name = "airlock-hermit-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Native Hermit QubesDB owner and interface admission"

[dependencies]
airlock-boot-core = { path = "../../airlock-common/boot" }
airlock-qubes-control = { path = "../../airlock-common/qubes-control" }

[target.'cfg(target_os = "hermit")'.dependencies]
# Native control transport and interface-lifetime support; machine adoption is separate.
xen-transport = { git = "https://github.com/airlockos-org/hermit-xen", rev = "46c08df4b0a0483e0e1dd84e02f9542ed92aaa08", features = ["hermit"] }
