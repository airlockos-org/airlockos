[package]
name = "airlock-hermit-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Native Hermit QubesDB owner and interface admission"

[dependencies]
airlock-boot-core = { path = "../../airlock-common/boot" }
airlock-qubes-network = { path = "../../airlock-common/qubes-network" }

[target.'cfg(target_os = "hermit")'.dependencies]
# Native control transport and interface-lifetime support; machine adoption is separate.
xen-transport = { git = "https://github.com/airlockos-org/hermit-xen", rev = "3460f02c38142d98fab7446ad1876370a677de26", features = ["hermit"] }
