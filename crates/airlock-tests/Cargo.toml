[package]
name = "airlock-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Development-only Airlock integration tests and inert process peers"

[[bin]]
name = "airlock-test-peer"
path = "src/main.rs"

[features]
default = ["qubes"]
qubes = ["dep:airlock-dom0-service", "airlock-dom0-service/qubes", "dep:airlock-qubes", "dep:pyo3"]

[[bin]]
name = "airlock-qubes-probe"
path = "src/qubes_probe.rs"
required-features = ["qubes"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
airlock-nix-core = { path = "../airlock-common/nix", features = ["runtime"] }
airlock-dom0-service = { path = "../airlock-dom0/service", default-features = false, optional = true }
airlock-qubes = { path = "../airlock-common/qubes", optional = true }
pyo3 = { version = "0.29.0", features = ["auto-initialize"], optional = true }
anyhow = "1.0"
flate2 = "1"
quick-xml = "0.41"
rustix = { version = "1.1", features = ["event", "fs", "process", "thread"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.0"
airlock-vm-service = { path = "../airlock-vm/service" }
airlock-deployment-core = { path = "../airlock-common/deployment" }

[dev-dependencies]
airlock-machine-core = { path = "../airlock-common/machine" }
png = "0.18"
libloading = "0.8"
x11rb = { version = "0.13", features = ["res"] }

[[bin]]
name = "airlock-test-runner"
path = "src/runner.rs"

[lib]
path = "src/lib.rs"

[[example]]
name = "qubes_objects"
path = "fixtures/qubes_objects.rs"
crate-type = ["cdylib"]
required-features = ["qubes"]

[[bin]]
name = "airlock-uplink-probe"
path = "src/uplink.rs"

[[bin]]
name = "airlock-test-report"
path = "src/report.rs"

[[bin]]
name = "airlock-smoke"
path = "src/smoke.rs"

[[bin]]
name = "airlock-input-probe"
path = "src/bin/airlock-input-probe.rs"
