[package]
name = "airlock-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Airlock application source selection and package construction"

[lib]
path = "src/lib.rs"

[dependencies]
airlock-build-plan = { path = "../build-plan" }
airlock-desktop = { path = "../desktop" }
rusix = { path = "../../vendor/rusix/crates/rusix", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.0"
