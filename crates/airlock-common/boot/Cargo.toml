[package]
name = "airlock-boot-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Validated startup challenges shared by Hermit services"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
uuid = { version = "1.28", default-features = false }
vstd = { version = "=0.0.0-2026-10-18-0147", default-features = false, features = ["alloc"] }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
