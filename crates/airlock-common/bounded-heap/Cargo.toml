[package]
name = "airlock-bounded-heap"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Fixed application heap and verified allocation credits"

[features]
default = []
allocator = ["dep:talc"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-18-0147", default-features = false, features = ["alloc"] }
talc = { version = "=5.0.4", features = ["counters"], optional = true }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
