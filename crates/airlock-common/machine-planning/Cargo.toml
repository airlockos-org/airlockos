[package]
name = "airlock-machine-planning"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Machine topology interpretation and VM lifecycle planning"

[lib]
path = "src/lib.rs"

[dependencies]
vstd = "=0.0.0-2026-10-18-0147"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
wire = ["dep:serde"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
