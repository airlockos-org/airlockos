[package]
name = "airlock-clipboard-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Bounded clipboard ownership and transfer policy"

[dependencies]
vstd = { version = "=0.0.0-2026-10-18-0147", default-features = false }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
