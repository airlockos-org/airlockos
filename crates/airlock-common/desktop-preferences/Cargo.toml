[package]
name = "airlock-desktop-preferences"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Validated desktop preferences and bounded snapshot framing"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Preserve arbitrary GNOME f64 scale values across repeated snapshot encodings.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
