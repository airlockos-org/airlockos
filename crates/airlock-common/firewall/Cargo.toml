[package]
name = "airlock-firewall-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"
description = "Bounded dual-stack routed firewall and NAT packet core"

[dependencies]
airlock-qubes-network = { path = "../qubes-network" }
# Wire codecs serve forwarding; one private IP/TCP endpoint handles truncated
# policy DNS replies. Native packets still pass through the engine's queues.
smoltcp = { version = "=0.13.1", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-raw", "socket-tcp"] }
# Reuse extension-header decoding and IP reassembly. The std feature supplies
# owned reassembly buffers on both Linux and Hermit; no second wire parser is maintained.
etherparse = "=0.21.0"
domain = { version = "=0.12.3", default-features = false, features = ["alloc"] }
rand_chacha = { version = "=0.9.0", default-features = false }
rand_core = { version = "=0.9.5", default-features = false }
internet-checksum = { version = "=0.2.1", default-features = false }
vstd = { version = "=0.0.0-2026-10-18-0147", default-features = false, features = ["alloc"] }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
