[package]
name = "airlock-qubes"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Rust bindings to upstream Qubes Python objects"

[lib]
path = "src/lib.rs"

[dependencies]
airlock-deployment-core = { path = "../deployment" }
anyhow = "1.0"
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
serde_json = "1.0"

