name: Quick checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIRLOCK_LOG_DIR: ${{ github.workspace }}/.airlock-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.AIRLOCK_CI_READ_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare stable Rust, pinned rustfmt and native development tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup override set stable
          make rust-fmt-prepare
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-4-dev libadwaita-1-dev bubblewrap xvfb dbus nodejs jq util-linux e2fsprogs ripgrep build-essential
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Prepare locked authoring dependencies
        run: |
          make prepare-dependencies
      - name: Check native code, docs and regression behavior
        run: make rust-check AIRLOCK_CARGO_VENDOR="$PWD/.airlock-cache/authoring-vendor"
      - name: Exercise durable deployment interruption and recovery
        run: cargo test --locked --manifest-path crates/Cargo.toml -p airlock-dom0-service durable_handoff -- --ignored --nocapture
      - name: Run prepared native integration checks
        run: |
          make test-quick test-native-mounts test-native-desktop test-native-javascript
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-test-reports
          path: .airlock-logs/
          include-hidden-files: true
          retention-days: 7

  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIRLOCK_USE_HOST_NIX_STORE: '1'
      AIRLOCK_LOG_DIR: ${{ github.workspace }}/.airlock-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.AIRLOCK_CI_READ_TOKEN || github.token }}
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
      - name: Prepare storage build tools and native test executables
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-4-dev libadwaita-1-dev bubblewrap xvfb dbus nodejs jq util-linux e2fsprogs ripgrep build-essential
          make prepare-dependencies native-integration-build
          make --silent prepare > .airlock-logs/prepared-source
      - name: Exercise real patched EROFS indexes
        run: |
          crates/target/debug/airlock-dev with-environment -- nix -- shell "$(cat .airlock-logs/prepared-source)/airlock-machine#airlock-erofs-utils" --command bash -euc '
            export AIRLOCK_EROFS_MKFS="$(command -v mkfs.erofs)"
            crates/target/debug/airlock-test-runner .airlock-logs/native-integration-build.jsonl --ignored packaged_erofs_ --nocapture
          '
      - name: Retain storage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-test-reports
          path: .airlock-logs/
          include-hidden-files: true
          retention-days: 7
