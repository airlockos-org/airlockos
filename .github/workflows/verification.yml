name: Verus production proofs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # These proof crates and their focused tests use only this repository's sources.
          submodules: false
          token: ${{ secrets.AIRLOCK_CI_READ_TOKEN || github.token }}
      - name: Prepare host Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify production deployment, planning, diagnostics, provisioning and build-source logic
        run: |
          mkdir -p .airlock-logs/verus
          set -o pipefail
          make verify-prepare 2>&1 | tee .airlock-logs/verus/verification.log
      - name: Exercise ordinary Cargo compilation, planning and gate behavior
        run: cargo test --locked --manifest-path crates/Cargo.toml -p airlock-machine-planning -p airlock-deployment-core -p airlock-machine-core -p airlock-nix-core -p airlock-diagnostics -p airlock-provisioning-core -p airlock-build-plan -p airlock-build --features airlock-diagnostics/runtime
      - name: Retain verification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verus-verification
          path: .airlock-logs/verus/
          include-hidden-files: true
          retention-days: 7
